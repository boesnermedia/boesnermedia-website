# Inhalte bearbeiten unter boesnermedia.de/admin
# Anmeldung mit GitHub. Jede Änderung wird als Version im GitHub-Projekt gespeichert.
backend:
  name: github
  repo: boesnermedia/boesnermedia-website
  branch: main

locale: de
media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  - name: seiten
    label: Seiten
    files:
      - name: startseite
        label: Startseite
        file: src/_data/startseite.json
        format: json
        fields:
          - label: Hero (ganz oben)
            name: hero
            widget: object
            fields:
              - { label: Kleine Zeile oben, name: eyebrow, widget: string }
              - { label: Überschrift Zeile 1, name: titel, widget: string }
              - { label: Überschrift Zeile 2 (Magenta), name: titel_akzent, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button, name: button, widget: string }
              - { label: Loop-Video (kurz, ohne Ton), name: loop_video, widget: file, required: false }
              - { label: Standbild zum Loop, name: loop_bild, widget: image, required: false }
              - { label: Showreel (lang, mit Ton), name: showreel_video, widget: file, required: false }
          - label: Kunden
            name: kunden
            widget: object
            fields:
              - { label: Zeile, name: zeile, widget: string }
              - label: Logos (nur mit Freigabe)
                name: logos
                widget: list
                required: false
                fields:
                  - { label: Firmenname, name: name, widget: string }
                  - { label: Logo, name: bild, widget: image }
          - label: Leistungen
            name: pakete
            widget: object
            fields:
              - { label: Kleine Zeile, name: eyebrow, widget: string }
              - { label: Überschrift, name: titel, widget: string }
              - { label: Überschrift (Magenta), name: titel_akzent, widget: string }
              - label: Leistungsfelder
                name: liste
                widget: list
                fields:
                  - { label: Leistungsfeld, name: feld, widget: string }
                  - { label: Paketname, name: name, widget: string }
                  - { label: Versprechen, name: versprechen, widget: string }
                  - { label: Vorschauvideo (5 Sek.), name: video, widget: file, required: false }
                  - { label: Vorschaubild (wenn kein Video), name: bild, widget: image, required: false }
                  - { label: Link zur Paketseite, name: link, widget: string, required: false }
                  - { label: Nicht als Karte zeigen, name: nur_unterseiten, widget: boolean, required: false }
          - label: Ein Dreh, alle Kanäle
            name: leitprinzip
            widget: object
            fields:
              - { label: Kleine Zeile, name: eyebrow, widget: string }
              - { label: Überschrift, name: titel, widget: string }
              - { label: Überschrift (Magenta), name: titel_akzent, widget: string }
              - { label: Text, name: text, widget: text }
              - label: Punkte
                name: punkte
                widget: list
                fields:
                  - { label: Titel, name: titel, widget: string }
                  - { label: Text, name: text, widget: string }
          - label: Prozess
            name: prozess
            widget: object
            fields:
              - { label: Überschrift, name: titel, widget: string }
              - label: Schritte
                name: schritte
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Text, name: text, widget: string }
          - label: THE LAB (KI-Workshops)
            name: academy
            widget: object
            fields:
              - { label: Kleine Zeile, name: eyebrow, widget: string }
              - { label: Überschrift, name: titel, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button, name: button, widget: string }
              - { label: Link, name: link, widget: string, required: false }
          - label: Sport-DNA
            name: roots
            widget: object
            fields:
              - { label: Kleine Zeile, name: eyebrow, widget: string }
              - { label: Überschrift, name: titel, widget: string }
              - { label: Überschrift (Magenta), name: titel_akzent, widget: string }
              - { label: Foto, name: bild, widget: image, required: false }
          - label: Kontakt-Abschluss
            name: kontakt
            widget: object
            fields:
              - { label: Überschrift, name: titel, widget: string }
              - { label: Text, name: text, widget: string }
              - { label: Porträt, name: bild, widget: image, required: false }
      - name: projekte
        label: Projekte
        file: src/_data/projekte.json
        format: json
        fields:
          - { label: Überschrift, name: titel, widget: string }
          - { label: Einleitung, name: intro, widget: text }
          - label: Projekte (das erste erscheint auch auf der Startseite)
            name: liste
            widget: list
            fields:
              - { label: Leistungsfeld, name: kategorie, widget: string }
              - { label: Titel, name: titel, widget: string }
              - { label: Titel (Magenta), name: titel_akzent, widget: string }
              - { label: Aufgabe, name: aufgabe, widget: string }
              - { label: Lösung, name: loesung, widget: string }
              - { label: Ergebnis, name: ergebnis, widget: string }
              - { label: Video, name: video, widget: file, required: false }
              - { label: Bild, name: bild, widget: image, required: false }
      - name: ueber
        label: Über mich
        file: src/_data/ueber.json
        format: json
        fields:
          - { label: Kleine Zeile, name: eyebrow, widget: string }
          - { label: Überschrift, name: titel, widget: string }
          - { label: Überschrift (Magenta), name: titel_akzent, widget: string }
          - { label: Text, name: text, widget: text }
          - { label: Porträt, name: portrait, widget: image, required: false }
          - { label: Zitat, name: vision, widget: text }
          - { label: Sport – kleine Zeile, name: sport_eyebrow, widget: string }
          - { label: Sport – Überschrift, name: sport_titel, widget: string }
          - { label: Sport – Überschrift (Magenta), name: sport_titel_akzent, widget: string }
          - { label: Sport – Text, name: sport_text, widget: text }
          - { label: Sport – Bild, name: sport_bild, widget: image, required: false }
          - { label: Überschrift Arbeitsweise, name: unterschiede_titel, widget: string }
          - label: Was mich unterscheidet
            name: unterschiede
            widget: list
            fields:
              - { label: Titel, name: titel, widget: string }
              - { label: Text, name: text, widget: string }
      - name: kontaktdaten
        label: Kontaktdaten
        file: src/_data/site.json
        format: json
        fields:
          - { label: Firmenname, name: name, widget: string }
          - { label: Inhaber, name: inhaber, widget: string }
          - { label: Website, name: url, widget: string }
          - { label: Beschreibung für Google, name: beschreibung, widget: text }
          - { label: Straße, name: strasse, widget: string }
          - { label: PLZ und Ort, name: ort, widget: string }
          - { label: Telefon (Anzeige), name: telefon, widget: string }
          - { label: Telefon (Link, ohne Leerzeichen), name: telefon_link, widget: string }
          - { label: E-Mail, name: email, widget: string }
          - { label: Antwortzeit, name: antwortzeit, widget: string }
          - { label: Formular-Server (setzt Claude), name: anfrage_endpunkt, widget: hidden }
  - name: pakete
    label: Leistungsseiten
    label_singular: Leistungsseite
    folder: src/leistungen
    extension: md
    format: frontmatter
    create: false
    fields:
      - { label: Layout, name: layout, widget: hidden, default: paket.njk }
      - { label: Adresse, name: permalink, widget: hidden }
      - { label: Seitentitel (Google), name: title, widget: string }
      - { label: Beschreibung (Google), name: description, widget: text }
      - { label: Paketname, name: name, widget: string }
      - { label: Leistungsfeld, name: feld, widget: string, required: false }
      - { label: Kurzname (für Buttons), name: kurzname, widget: string, required: false }
      - { label: Kleine Zeile oben, name: eyebrow, widget: string }
      - { label: Versprechen, name: claim, widget: string }
      - { label: Einleitung, name: intro, widget: text }
      - { label: Beispielvideo, name: video, widget: file, required: false }
      - { label: Vorschaubild zum Video, name: video_poster, widget: image, required: false }
      - { label: Video ist Hochformat, name: video_hochkant, widget: boolean, required: false }
      - { label: Bild (wenn kein Video), name: bild, widget: image, required: false }
      - { label: Überschrift Ziele, name: ziel_titel, widget: string }
      - label: Ziele
        name: ziele
        widget: list
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Text, name: text, widget: string }
      - { label: Zielgruppe, name: zielgruppe, widget: string }
      - { label: Dauer bis zum fertigen Video, name: dauer, widget: string, required: false }
      - { label: Eigener Satz zur Dauer (ersetzt die Dauer), name: dauer_satz, widget: string, required: false }
      - { label: Kleine Zeile Ablauf, name: ablauf_eyebrow, widget: string, required: false }
      - { label: Überschrift Ablauf, name: ablauf_titel, widget: string, required: false }
      - { label: Überschrift Abschluss, name: cta_titel, widget: string, required: false }
      - { label: Kleine Zeile Formate, name: varianten_eyebrow, widget: string, required: false }
      - { label: Überschrift Formate, name: varianten_titel, widget: string, required: false }
      - label: Formate
        name: varianten
        widget: list
        required: false
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Für wen, name: fuer, widget: string }
          - { label: Punkte, name: punkte, widget: list }
      - label: Phasen
        name: phasen
        widget: list
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Untertitel, name: untertitel, widget: string }
          - label: Leistungen
            name: leistungen
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Text, name: text, widget: string }
      - label: Aufwand für den Kunden
        name: aufwand
        widget: list
        required: false
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Text, name: text, widget: string }
      - { label: Immer inklusive, name: inklusive, widget: list }
      - { label: Text zu den Bausteinen, name: bausteine_text, widget: text }
      - label: Bausteine
        name: bausteine
        widget: list
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Text, name: text, widget: string }
      - { label: Beispielprojekt (leer = Abschnitt ausgeblendet), name: beispiel, widget: text, required: false }
      - { label: Vorschaubild für LinkedIn/WhatsApp (1200×630), name: og_bild, widget: image, required: false }
      - label: Häufige Fragen
        name: faq
        widget: list
        fields:
          - { label: Frage, name: frage, widget: string }
          - { label: Antwort, name: antwort, widget: text }
      - { label: Text, name: body, widget: hidden, required: false }
  - name: rechtliches
    label: Impressum & Datenschutz
    files:
      - name: impressum
        label: Impressum
        file: src/impressum.md
        fields:
          - { label: Layout, name: layout, widget: hidden }
          - { label: Titel, name: title, widget: string }
          - { label: Adresse, name: permalink, widget: hidden }
          - { label: Text, name: body, widget: markdown }
      - name: datenschutz
        label: Datenschutz
        file: src/datenschutz.md
        fields:
          - { label: Layout, name: layout, widget: hidden }
          - { label: Titel, name: title, widget: string }
          - { label: Adresse, name: permalink, widget: hidden }
          - { label: Text, name: body, widget: markdown }
